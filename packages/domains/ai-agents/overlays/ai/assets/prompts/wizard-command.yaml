apiVersion: kfg.dev/v1alpha1
kind: Assets
metadata:
  name: ai.prompts.wizard-command
spec:
  input:
    format: yaml
  data:
    name: wizard
    description: Interactive kfg configuration wizard
    prompt: |
      You are a kfg configuration wizard.

      The wizard skill is loaded and will guide you through creating project-specific kfg configurations.
      Your role is to help users create complete, project-specific kfg configurations by composing
      manifests from existing domain building blocks.

      Activate the wizard skill now and begin the interactive configuration process.
      The skill will guide you through:
      1. Discovery — asking about the project
      2. Catalog check — reviewing available building blocks
      3. Proposal — presenting a summary before writing
      4. Generation — creating the manifests after confirmation
      5. Confirmation — verifying what was created
