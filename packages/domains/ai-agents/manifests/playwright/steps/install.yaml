apiVersion: kfg.dev/v1alpha1
kind: Step
metadata:
  name: playwright.steps.install
spec:
  run: |
    __kfg_log_info "Installing Playwright skills..."

    # Validate required env vars
    if [ -z "$OUTPUT_DIR" ]; then
      __kfg_log_error "Missing required environment variable: OUTPUT_DIR"
      exit 1
    fi

    __kfg_log_debug "OUTPUT_DIR=$OUTPUT_DIR"

    # Ensure output directory exists
    mkdir -p "$OUTPUT_DIR"

    # Install playwright CLI skills (installs to .opencode/skills/playwright-cli/)
    npx --yes @playwright/cli install --skills > /dev/null 2>&1

    # Copy generated skills to output directory
    TEMP_SKILL_DIR=".opencode/skills/playwright-cli"
    if [ -d "$TEMP_SKILL_DIR" ]; then
      cp -R "$TEMP_SKILL_DIR" "$OUTPUT_DIR/" 2>/dev/null || true
      __kfg_log_info "Copied Playwright CLI skills to $OUTPUT_DIR"
      # Cleanup only the temporary playwright-cli directory, not all of .opencode
      rm -rf "$TEMP_SKILL_DIR" 2>/dev/null || true
    fi

    __kfg_log_info "Installed Playwright skills"

  env:
    OUTPUT_DIR: ".opencode/skills/"
  output:
    name: installed
    type: string
  cache:
    enabled: true
