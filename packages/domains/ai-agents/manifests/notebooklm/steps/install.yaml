apiVersion: kfg.dev/v1alpha1
kind: Step
metadata:
  name: notebooklm.steps.install
spec:
  run: |
    __kfg_log_info "Installing NotebookLM skills..."

    # Validate required env vars
    if [ -z "$OUTPUT_DIR" ]; then
      __kfg_log_error "Missing required environment variable: OUTPUT_DIR"
      exit 1
    fi

    __kfg_log_debug "OUTPUT_DIR=$OUTPUT_DIR"

    # Ensure output directory exists
    mkdir -p "$OUTPUT_DIR"

    # Execute notebooklm skill install (installs to ~/.opencode/skills/notebooklm/)
    notebooklm skill install > /dev/null 2>&1

    # Copy generated NotebookLM skill files into overlay-owned output paths
    NOTEBOOKLM_SKILL_DIR="$HOME/.opencode/skills/notebooklm"
    if [ -d "$NOTEBOOKLM_SKILL_DIR" ]; then
      cp -r "$NOTEBOOKLM_SKILL_DIR"/* "$OUTPUT_DIR/" 2>/dev/null || true
      rm -rf "$NOTEBOOKLM_SKILL_DIR" 2>/dev/null || true
      rm -rf "$HOME/.agents/skills/notebooklm" 2>/dev/null || true
      __kfg_log_info "Copied NotebookLM skills from $NOTEBOOKLM_SKILL_DIR to $OUTPUT_DIR"
    fi

    __kfg_log_info "Installed NotebookLM skills"

  env:
    OUTPUT_DIR: ".opencode/skills/"
  output:
    name: installed
    type: string
  cache:
    enabled: true
