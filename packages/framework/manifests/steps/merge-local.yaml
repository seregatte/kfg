apiVersion: kfg.dev/v1alpha1
kind: Step
metadata:
  name: kfg.merge-local
spec:
  run: |
    local src="${SRC:-}"
    local dest="${DEST:-.}"
    local mode="${MODE:-deep}"
    local filter="${FILTER:-}"

    if [[ -z "$src" ]]; then
      __kfg_log_warn "merge-local" "SRC not set, skipping"
      return 0
    fi

    if [[ ! -d "$src" ]]; then
      __kfg_log_info "merge-local" "SRC directory not found, skipping: ${src}"
      return 0
    fi

    __kfg_log_info "merge-local" "merging ${src} -> ${dest} (mode=${mode})"

    local find_args=()
    [[ -n "$filter" ]] && find_args+=(-name "$filter")

    local merged_count=0
    local copied_count=0
    local skipped_count=0

    while IFS= read -r -d '' file; do
      local rel="${file#$src/}"
      local target="${dest}/${rel}"
      local target_dir
      target_dir="$(dirname "$target")"

      if [[ "$mode" == "skip" && -f "$target" ]]; then
        __kfg_log_detail "merge-local" "skip (exists): ${rel}"
        ((skipped_count++))
        continue
      fi

      mkdir -p "$target_dir"

      if [[ "$mode" == "deep" && -f "$target" ]]; then
        local merged=0
        case "$file" in
          *.json)
            if command -v jq &>/dev/null; then
              local tmp
              tmp=$(jq -s '.[0] * .[1]' "$target" "$file" 2>/dev/null) && \
                printf '%s\n' "$tmp" > "$target" && merged=1
            fi
            ;;
          *.yaml|*.yml)
            if command -v yq &>/dev/null; then
              local tmp
              tmp=$(yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' \
                "$target" "$file" 2>/dev/null) && \
                printf '%s\n' "$tmp" > "$target" && merged=1
            fi
            ;;
        esac
        if [[ $merged -eq 1 ]]; then
          __kfg_log_detail "merge-local" "deep-merged: ${rel}"
          __kfg_add_artifact "$target"
          ((merged_count++))
          continue
        fi
        __kfg_log_detail "merge-local" "deep merge failed, falling back to copy: ${rel}"
      fi

      cp "$file" "$target"
      __kfg_log_detail "merge-local" "copied: ${rel}"
      __kfg_add_artifact "$target"
      ((copied_count++))
    done < <(find "$src" -type f -print0 "${find_args[@]}")

    __kfg_add_artifact "$dest"
    __kfg_log_info "merge-local" \
      "done: ${merged_count} merged, ${copied_count} copied, ${skipped_count} skipped"

  artifacts:
    - merged
  env:
    SRC: ""
    DEST: "."
    MODE: "deep"
    FILTER: ""
